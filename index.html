<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CWO Daily Digest | Wellbeing & Positive Psychology</title>
  
  <!-- Apple/iOS WebApp Setting -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CWO Digest">
  <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/sun-emoji.png">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent-color: #0d9488;
      --accent-hover: #0f766e;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --accent-color: #14b8a6;
        --accent-hover: #2dd4bf;
        --border-color: #334155;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-color);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-refresh {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-refresh:hover {
      background: var(--accent-hover);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .status-bar {
      margin-bottom: 20px;
      font-size: 0.875rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 640px) {
      .news-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .news-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-source {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .card-snippet {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .card-links {
      display: flex;
      gap: 12px;
    }

    .card-link {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .card-link-sub {
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 500;
    }

    .card-link:hover, .card-link-sub:hover { text-decoration: underline; }

    .loader {
      text-align: center;
      padding: 40px;
      font-size: 1.1rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <h1>☀️ CWO Digest</h1>
    <button class="btn-refresh" onclick="loadAllFeeds()">更新</button>
  </header>

  <main>
    <div class="status-bar">
      <span>毎朝のインプット・最新情報（全ページ日本語翻訳対応）</span>
      <span id="last-updated">更新中...</span>
    </div>

    <div id="loader" class="loader">世界中から最新ニュースを取得＆日本語翻訳中...</div>
    <div id="news-grid" class="news-grid"></div>
  </main>

  <script>
    const RSS_SOURCES = [
      { name: "Greater Good Science Center (UC Berkeley)", url: "https://greatergood.berkeley.edu/site/rss/news" },
      { name: "Psychology Today (Positive Psych)", url: "https://www.psychologytoday.com/us/blog-topics/positive-psychology/feed" },
      { name: "Positive Psychology.com", url: "https://positivepsychology.com/feed/" },
      { name: "Gallup News (Workplace)", url: "https://news.gallup.com/xml/rss/212621/workplace.xml" },
      { name: "ScienceDaily (Well-being)", url: "https://www.sciencedaily.com/rss/mind_brain/positivity.xml" }
    ];

    async function translateText(text) {
      if (!text) return "";
      try {
        const cleanText = text.replace(/<[^>]*>?/gm, '').substring(0, 150);
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=en|ja`);
        const data = await res.json();
        return data.responseData.translatedText || cleanText;
      } catch (e) {
        return text;
      }
    }

    // Google翻訳の自動翻訳URLを生成する関数
    function getTranslatedUrl(originalUrl) {
      return `https://translate.google.com/translate?sl=auto&tl=ja&u=${encodeURIComponent(originalUrl)}`;
    }

    async function fetchRSS(source) {
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`);
        const data = await res.json();
        if (data.status !== 'ok') return [];
        
        const items = data.items.slice(0, 3);
        
        return await Promise.all(items.map(async item => {
          const titleJa = await translateText(item.title);
          const snippetJa = await translateText(item.description);
          
          return {
            sourceName: source.name,
            title: titleJa,
            snippet: snippetJa,
            link: item.link,
            translatedLink: getTranslatedUrl(item.link),
            pubDate: new Date(item.pubDate).toLocaleDateString("ja-JP")
          };
        }));
      } catch (e) {
        console.error("Fetch error:", e);
        return [];
      }
    }

    async function loadAllFeeds() {
      const loader = document.getElementById('loader');
      const grid = document.getElementById('news-grid');
      const updatedText = document.getElementById('last-updated');
      
      loader.style.display = 'block';
      grid.innerHTML = '';
      
      let allArticles = [];
      for (const source of RSS_SOURCES) {
        const articles = await fetchRSS(source);
        allArticles = allArticles.concat(articles);
      }

      loader.style.display = 'none';

      if(allArticles.length === 0) {
        grid.innerHTML = '<p>ニュースの取得に失敗しました。時間をおいて再試行してください。</p>';
        return;
      }

      allArticles.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-source">${item.sourceName}</div>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-snippet">${item.snippet}...</p>
          </div>
          <div class="card-footer">
            <span>${item.pubDate}</span>
            <div class="card-links">
              <a class="card-link" href="${item.translatedLink}" target="_blank" rel="noopener">日本語で読む ↗</a>
              <a class="card-link-sub" href="${item.link}" target="_blank" rel="noopener">(原文)</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      const now = new Date();
      updatedText.innerText = `最終更新: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    window.onload = loadAllFeeds;
  </script>
</body>
</html>
