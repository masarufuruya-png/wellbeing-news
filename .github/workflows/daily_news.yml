name: Update Well-being News Daily

on:
  schedule:
    # 毎日 日本時間の朝7:00（UTC 22:00）に自動実行
    - cron: '0 22 * * *'
  # 手動でテスト実行できるようにするボタンを追加
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install google-genai pydantic

      - name: AIで最新ニュースを生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_news.py

      - name: 生成したデータをGitHubに保存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news.json
          git commit -m "Update daily well-being news" || exit 0
          git push
